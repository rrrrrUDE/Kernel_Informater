name: Gauguin LKM Build

on:
  workflow_dispatch:
  push:
    branches: ["purplemi_gauguin_lkm"]
  pull_request:
    branches: ["purplemi_gauguin_lkm"]

permissions:
  contents: read

jobs:
  build:
    name: LKM · Android 4.19 · Manual Hook
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Informater
        uses: actions/checkout@v4

      - name: Checkout Android Kernel
        run: |
          set -eux

          git clone --depth=1 \
            https://github.com/rrrrrUDE/android_kernel_xiaomi_gauguin.git \
            kernel-tree

      - name: Install build dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            python3 \
            wget \
            gnupg \
            ca-certificates \
            openssl \
            kmod

          wget -O - https://apt.llvm.org/llvm.sh | \
            sudo bash -s -- 23

          sudo apt-get install -y \
            clang-23 \
            lld-23 \
            llvm-23

      - name: Setup LLVM 23
        run: |
          set -eux

          sudo ln -sf /usr/bin/clang-23 \
            /usr/local/bin/clang

          sudo ln -sf /usr/bin/clang++-23 \
            /usr/local/bin/clang++

          sudo ln -sf /usr/bin/ld.lld-23 \
            /usr/local/bin/ld.lld

          for tool in \
            llvm-ar \
            llvm-nm \
            llvm-objcopy \
            llvm-objdump \
            llvm-readelf \
            llvm-strip \
            llvm-ranlib \
            llvm-size \
            llvm-strings \
            llvm-cxxfilt
          do
            if [ -x "/usr/bin/${tool}-23" ]; then
              sudo ln -sf \
                "/usr/bin/${tool}-23" \
                "/usr/local/bin/${tool}"
            fi
          done

          echo "=== LLVM ==="
          clang --version
          clang++ --version
          ld.lld --version
          llvm-ar --version
          llvm-nm --version
          llvm-objcopy --version
          llvm-objdump --version
          llvm-readelf --version
          llvm-strip --version

      - name: Verify LLVM toolchain
        run: |
          set -eux

          command -v clang
          command -v clang++
          command -v ld.lld
          command -v llvm-ar
          command -v llvm-nm
          command -v llvm-objcopy
          command -v llvm-objdump
          command -v llvm-readelf
          command -v llvm-strip

          clang --version | head -n 1
          ld.lld --version | head -n 1

      - name: Inspect kernel signing support
        working-directory: kernel-tree
        run: |
          set -eux

          echo "=== Kernel Makefile mod_sign_cmd ==="

          grep -n -A8 -B3 \
            'mod_sign_cmd' \
            Makefile

          echo "=== Kernel signing files ==="

          find . -maxdepth 3 -type f \
            \( \
              -name 'signing_key.pem' \
              -o -name 'signing_key.priv' \
              -o -name 'signing_key.x509' \
              -o -name 'verity_dev_keys.x509' \
            \) \
            -print

          echo "=== Existing verity_dev_keys.x509 ==="

          if [ -f verity_dev_keys.x509 ]; then
            ls -lh verity_dev_keys.x509
            file verity_dev_keys.x509

            openssl x509 \
              -in verity_dev_keys.x509 \
              -noout \
              -subject \
              -issuer \
              -serial \
              -fingerprint \
              -sha256
          fi

      - name: Integrate Kernel Informater
        run: |
          set -eux

          mkdir -p \
            kernel-tree/kernel/Kernel_Informater

          cp -a \
            kernel/. \
            kernel-tree/kernel/Kernel_Informater/

          printf '\nsource "kernel/Kernel_Informater/Kconfig"\n' \
            >> kernel-tree/Kconfig

          printf '\nobj-$(CONFIG_KI) += Kernel_Informater/\n' \
            >> kernel-tree/kernel/Makefile

          rm -rf \
            kernel-tree/kernel/Kernel_Informater/uapi

          mkdir -p \
            kernel-tree/kernel/Kernel_Informater/uapi

          cp -a \
            uapi/. \
            kernel-tree/kernel/Kernel_Informater/uapi/

          sh \
            kernel-tree/kernel/Kernel_Informater/integrate.sh \
            kernel-tree

      - name: Configure Manual Hook
        working-directory: kernel-tree
        run: |
          set -eux

          make \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            defconfig

          scripts/config \
            --enable CONFIG_MODULES

          scripts/config \
            --set-val CONFIG_KI m

          scripts/config \
            --disable CONFIG_KI_TRACEPOINT_HOOK

          scripts/config \
            --disable CONFIG_KGDB

          make \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

          echo "=== Effective KI configuration ==="

          grep -E \
            '^(CONFIG_KI|CONFIG_MODULES|CONFIG_KI_TRACEPOINT_HOOK|CONFIG_TRACEPOINTS)=' \
            .config || true

          echo "=== Module signing configuration ==="

          grep -E \
            '^(CONFIG_MODULE_SIG|CONFIG_MODULE_SIG_KEY|CONFIG_MODULE_SIG_HASH)=' \
            .config || true

          test "$(grep -c '^CONFIG_KI=m$' .config)" -eq 1
          test "$(grep -c '^CONFIG_MODULES=y$' .config)" -eq 1

      - name: Verify Manual Hook mode
        working-directory: kernel-tree
        run: |
          set -eux

          VERSION=$(sed \
            -n 's/^VERSION = //p' \
            Makefile)

          PATCHLEVEL=$(sed \
            -n 's/^PATCHLEVEL = //p' \
            Makefile)

          echo "Kernel VERSION: ${VERSION}"
          echo "Kernel PATCHLEVEL: ${PATCHLEVEL}"

          test "${VERSION}" -ge 3

          if grep -q \
            '^CONFIG_KI_TRACEPOINT_HOOK=y$' \
            .config
          then
            echo "ERROR: Tracepoint Hook is enabled"
            exit 1
          fi

      - name: Verify module signing configuration
        working-directory: kernel-tree
        run: |
          set -eux

          echo "=== Module signing configuration ==="

          grep -E \
            '^(CONFIG_MODULE_SIG|CONFIG_MODULE_SIG_FORCE|CONFIG_MODULE_SIG_ALL|CONFIG_MODULE_SIG_HASH|CONFIG_MODULE_SIG_KEY)=' \
            .config || true

          echo "=== mod_sign_cmd ==="

          grep -n -A6 -B3 \
            'mod_sign_cmd' \
            Makefile

          echo "=== Signing certificate ==="

          test -f certs/signing_key.x509

          ls -lh \
            certs/signing_key.x509

          echo "=== sign-file ==="

          test -x scripts/sign-file || \
            test -f scripts/sign-file

      - name: Prepare external module build
        working-directory: kernel-tree
        run: |
          set -eux

          make -j2 \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            HOSTCFLAGS=-fcommon \
            modules_prepare

      - name: Build Kernel Informater
        working-directory: kernel-tree
        run: |
          set -eux

          make -j2 \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            HOSTCFLAGS=-fcommon \
            M=kernel/Kernel_Informater \
            modules

          test -f \
            kernel/Kernel_Informater/ki.ko

          echo "=== Built module ==="

          ls -lh \
            kernel/Kernel_Informater/ki.ko

          file \
            kernel/Kernel_Informater/ki.ko

      - name: Verify signed Kernel Informater
        working-directory: kernel-tree
        run: |
          set -eux

          KO="kernel/Kernel_Informater/ki.ko"

          test -f "${KO}"

          echo "=== Module information ==="

          modinfo "${KO}" || true

          echo "=== Signature information ==="

          modinfo "${KO}" | \
            grep -E \
              '^(signer|sig_key|sig_hashalgo):' \
              || true

          echo "=== Kernel module signature marker ==="

          if modinfo "${KO}" | \
              grep -q '^sig_hashalgo:'
          then
            echo "Kernel Informater module is signed."
          else
            echo "ERROR: Kernel Informater module does not contain a recognized signature."
            exit 1
          fi

          echo "=== Final module ==="

          ls -lh "${KO}"

          file "${KO}"

      - name: Upload signed LKM
        uses: actions/upload-artifact@v4
        with:
          name: android-4-19-manual-hook-signed
          path: kernel-tree/kernel/Kernel_Informater/ki.ko
          if-no-files-found: error
          retention-days: 30
