name: Gauguin LKM Build

on:
  workflow_dispatch:
  push:
    branches: ["purplemi_gauguin_lkm"]
  pull_request:
    branches: ["purplemi_gauguin_lkm"]

permissions:
  contents: read

jobs:
  build:
    name: LKM · Android 4.19 · Manual Hook · Signed
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Informater
        uses: actions/checkout@v4

      - name: Checkout Android Kernel
        run: |
          set -eux

          git clone --depth=1 \
            https://github.com/rrrrrUDE/android_kernel_xiaomi_gauguin.git \
            kernel-tree

      - name: Install build dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            python3 \
            wget \
            gnupg \
            ca-certificates \
            openssl \
            kmod

          wget -O - https://apt.llvm.org/llvm.sh | \
            sudo bash -s -- 23

          sudo apt-get install -y \
            clang-23 \
            lld-23 \
            llvm-23

      - name: Setup LLVM 23
        run: |
          set -eux

          sudo ln -sf /usr/bin/clang-23 \
            /usr/local/bin/clang

          sudo ln -sf /usr/bin/clang++-23 \
            /usr/local/bin/clang++

          sudo ln -sf /usr/bin/ld.lld-23 \
            /usr/local/bin/ld.lld

          for tool in \
            llvm-ar \
            llvm-nm \
            llvm-objcopy \
            llvm-objdump \
            llvm-readelf \
            llvm-strip \
            llvm-ranlib \
            llvm-size \
            llvm-strings \
            llvm-cxxfilt
          do
            if [ -x "/usr/bin/${tool}-23" ]; then
              sudo ln -sf \
                "/usr/bin/${tool}-23" \
                "/usr/local/bin/${tool}"
            fi
          done

          echo "=== LLVM toolchain ==="
          clang --version
          clang++ --version
          ld.lld --version
          llvm-ar --version
          llvm-nm --version
          llvm-objcopy --version
          llvm-objdump --version
          llvm-readelf --version
          llvm-strip --version

      - name: Verify LLVM toolchain
        run: |
          set -eux

          command -v clang
          command -v clang++
          command -v ld.lld
          command -v llvm-ar
          command -v llvm-nm
          command -v llvm-objcopy
          command -v llvm-objdump
          command -v llvm-readelf
          command -v llvm-strip

          clang --version | head -n 1
          ld.lld --version | head -n 1

      - name: Integrate Kernel Informater
        run: |
          set -eux

          mkdir -p kernel-tree/kernel/Kernel_Informater

          cp -a \
            kernel/. \
            kernel-tree/kernel/Kernel_Informater/

          printf '\nsource "kernel/Kernel_Informater/Kconfig"\n' \
            >> kernel-tree/Kconfig

          printf '\nobj-$(CONFIG_KI) += Kernel_Informater/\n' \
            >> kernel-tree/kernel/Makefile

          rm -rf \
            kernel-tree/kernel/Kernel_Informater/uapi

          mkdir -p \
            kernel-tree/kernel/Kernel_Informater/uapi

          cp -a \
            uapi/. \
            kernel-tree/kernel/Kernel_Informater/uapi/

          sh \
            kernel-tree/kernel/Kernel_Informater/integrate.sh \
            kernel-tree

      - name: Configure Manual Hook and Module Signing
        working-directory: kernel-tree
        run: |
          set -eux

          make \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            defconfig

          # Kernel Informater
          scripts/config \
            --enable CONFIG_MODULES

          scripts/config \
            --set-val CONFIG_KI m

          scripts/config \
            --disable CONFIG_KI_TRACEPOINT_HOOK

          # Disable unrelated debug configuration
          scripts/config \
            --disable CONFIG_KGDB

          # Kernel module signing
          scripts/config \
            --enable CONFIG_MODULE_SIG

          scripts/config \
            --enable CONFIG_MODULE_SIG_FORCE

          scripts/config \
            --enable CONFIG_MODULE_SIG_ALL

          scripts/config \
            --enable CONFIG_MODULE_SIG_SHA512

          scripts/config \
            --set-str CONFIG_MODULE_SIG_HASH sha512

          scripts/config \
            --set-str CONFIG_MODULE_SIG_KEY certs/signing_key.pem

          make \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

          echo "=== Effective KI configuration ==="

          grep -E \
            '^(CONFIG_KI=|CONFIG_KI_TRACEPOINT_HOOK=|CONFIG_MODULES=)' \
            .config || true

          echo "=== Effective module signing configuration ==="

          grep -E \
            '^(CONFIG_MODULE_SIG|CONFIG_MODULE_SIG_FORCE|CONFIG_MODULE_SIG_ALL|CONFIG_MODULE_SIG_SHA512|CONFIG_MODULE_SIG_HASH|CONFIG_MODULE_SIG_KEY)=' \
            .config

          test "$(grep -c '^CONFIG_KI=m$' .config)" -eq 1
          test "$(grep -c '^CONFIG_MODULES=y$' .config)" -eq 1
          test "$(grep -c '^CONFIG_MODULE_SIG=y$' .config)" -eq 1
          test "$(grep -c '^CONFIG_MODULE_SIG_FORCE=y$' .config)" -eq 1
          test "$(grep -c '^CONFIG_MODULE_SIG_ALL=y$' .config)" -eq 1
          test "$(grep -c '^CONFIG_MODULE_SIG_SHA512=y$' .config)" -eq 1
          grep -q '^CONFIG_MODULE_SIG_HASH="sha512"$' .config
          grep -q '^CONFIG_MODULE_SIG_KEY="certs/signing_key.pem"$' .config

      - name: Verify Manual Hook mode
        working-directory: kernel-tree
        run: |
          set -eux

          VERSION=$(sed \
            -n 's/^VERSION = //p' \
            Makefile)

          PATCHLEVEL=$(sed \
            -n 's/^PATCHLEVEL = //p' \
            Makefile)

          echo "Kernel VERSION: ${VERSION}"
          echo "Kernel PATCHLEVEL: ${PATCHLEVEL}"

          test "${VERSION}" -ge 3

          if grep -q '^CONFIG_KI_TRACEPOINT_HOOK=y$' .config; then
            echo "ERROR: Tracepoint Hook must be disabled for Android 4.19."
            exit 1
          fi

      - name: Prepare kernel build system
        working-directory: kernel-tree
        run: |
          set -eux

          make -j2 \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            HOSTCFLAGS=-fcommon \
            scripts

          make -j2 \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            HOSTCFLAGS=-fcommon \
            modules_prepare

      - name: Generate kernel module signing certificate
        working-directory: kernel-tree
        run: |
          set -eux

          echo "=== Module signing setup ==="

          echo "CONFIG_MODULE_SIG_KEY:"
          grep '^CONFIG_MODULE_SIG_KEY=' .config

          echo "=== Before generation ==="

          ls -lh \
            certs/signing_key.pem \
            certs/signing_key.x509 \
            2>/dev/null || true

          # Let the kernel's own certs/Makefile generate the signing
          # key/certificate when the configured key is not already present.
          make -j2 \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            HOSTCFLAGS=-fcommon \
            certs/signing_key.x509

          echo "=== After generation ==="

          test -f certs/signing_key.pem
          test -f certs/signing_key.x509

          ls -lh \
            certs/signing_key.pem \
            certs/signing_key.x509

          echo "=== Signing certificate information ==="

          openssl x509 \
            -in certs/signing_key.x509 \
            -noout \
            -subject \
            -issuer \
            -serial \
            -fingerprint \
            -sha256

      - name: Verify mod_sign_cmd
        working-directory: kernel-tree
        run: |
          set -eux

          echo "=== Kernel mod_sign_cmd ==="

          grep -n -A5 -B3 \
            'mod_sign_cmd' \
            Makefile

          echo "=== Expected signing certificate ==="

          test -f certs/signing_key.x509

          echo "=== sign-file ==="

          test -f scripts/sign-file

          file scripts/sign-file

      - name: Build Kernel Informater
        working-directory: kernel-tree
        run: |
          set -eux

          make -j2 \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            HOSTCFLAGS=-fcommon \
            M=kernel/Kernel_Informater \
            modules

          test -f \
            kernel/Kernel_Informater/ki.ko

          echo "=== Final Kernel Informater module ==="

          ls -lh \
            kernel/Kernel_Informater/ki.ko

          file \
            kernel/Kernel_Informater/ki.ko

      - name: Verify signed Kernel Informater
        working-directory: kernel-tree
        run: |
          set -eux

          KO="kernel/Kernel_Informater/ki.ko"

          test -f "${KO}"

          echo "=== modinfo ==="

          modinfo "${KO}" || true

          echo "=== Signature fields ==="

          modinfo "${KO}" | \
            grep -E \
              '^(signer|sig_key|sig_hashalgo):'

          echo "=== Signature verification ==="

          SIG_HASH=$(modinfo "${KO}" | \
            sed -n 's/^sig_hashalgo:[[:space:]]*//p')

          test "${SIG_HASH}" = "sha512"

          echo "Detected module signature hash: ${SIG_HASH}"

          echo "=== Final module ==="

          ls -lh "${KO}"
          file "${KO}"

      - name: Upload signed LKM
        uses: actions/upload-artifact@v4
        with:
          name: android-4-19-manual-hook-signed
          path: kernel-tree/kernel/Kernel_Informater/ki.ko
          if-no-files-found: error
          retention-days: 30
