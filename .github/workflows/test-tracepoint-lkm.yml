name: Test Tracepoint Syscall Redirect LKM on Android 12 5.10

on:
  workflow_dispatch:
  push:
    branches: ["filesystem-kfunc"]
    paths:
      - "kernel/**"
      - "uapi/**"
      - "userspace/kicmd/**"
      - ".github/workflows/test-tracepoint-lkm.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "kernel/**"
      - "uapi/**"
      - "userspace/kicmd/**"
      - ".github/workflows/test-tracepoint-lkm.yml"

jobs:
  test-tracepoint-lkm:
    name: Test Tracepoint Syscall Redirect LKM · Android 12-5.10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Informater
        uses: actions/checkout@v4

      - name: Checkout Android Common
        run: |
          git clone --depth=1 --branch android12-5.10 \
            https://android.googlesource.com/kernel/common kernel-tree

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev python3 \
            clang-14 lld-14 binutils-aarch64-linux-gnu

      - name: Integrate Kernel Informater
        run: |
          set -eux
          mkdir -p kernel-tree/kernel/Kernel_Informater
          cp -a kernel/. kernel-tree/kernel/Kernel_Informater/
          printf '\nsource "kernel/Kernel_Informater/Kconfig"\n' >> kernel-tree/kernel/Kconfig
          printf '\nobj-$(CONFIG_KI) += Kernel_Informater/\n' >> kernel-tree/kernel/Makefile

      - name: Configure Tracepoint Syscall Redirect mode
        working-directory: kernel-tree
        run: |
          make ARCH=arm64 defconfig
          scripts/config --set-val CONFIG_KI m
          scripts/config --enable CONFIG_MODULES
          scripts/config --enable CONFIG_FTRACE
          scripts/config --enable CONFIG_TRACEPOINTS
          scripts/config --enable CONFIG_KI_TRACEPOINT_HOOK
          scripts/config --disable CONFIG_KGDB
          make ARCH=arm64 olddefconfig
          grep -q '^CONFIG_KI=m -E '^(CONFIG_KI=|CONFIG_KI_TRACEPOINT_HOOK=|CONFIG_MODULES=|CONFIG_TRACEPOINTS=|CONFIG_HAVE_SYSCALL_TRACEPOINTS=|)' .config

      - name: Verify Tracepoint prerequisites
        working-directory: kernel-tree
        run: |
          test "$(sed -n 's/^VERSION = //p' Makefile)" -ge 5
          test "$(sed -n 's/^PATCHLEVEL = //p' Makefile)" -ge 10
          grep -q '^CONFIG_TRACEPOINTS=y' .config
          grep -q '^CONFIG_HAVE_SYSCALL_TRACEPOINTS=y' .config

      - name: Prepare LKM build
        working-directory: kernel-tree
        run: |
          make -j2 ARCH=arm64 CC=clang-14 LD=ld.lld-14 \
            CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- \
            HOSTCFLAGS=-fcommon LLVM_IAS=1 modules_prepare

      - name: Build Kernel Informater LKM
        working-directory: kernel-tree
        run: |
          make -j2 ARCH=arm64 CC=clang-14 LD=ld.lld-14 \
            CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- \
            HOSTCFLAGS=-fcommon LLVM_IAS=1 M=kernel/Kernel_Informater modules
          test -f kernel/Kernel_Informater/ki.ko
          file kernel/Kernel_Informater/ki.ko

      - name: Upload LKM
        uses: actions/upload-artifact@v4
        with:
          name: ki-tracepoint-syscall-redirect-android12-5.10
          path: kernel-tree/kernel/Kernel_Informater/ki.ko
 .config
          grep -E '^(CONFIG_KI=|CONFIG_KI_TRACEPOINT_HOOK=|CONFIG_MODULES=|CONFIG_TRACEPOINTS=|CONFIG_HAVE_SYSCALL_TRACEPOINTS=|)' .config

      - name: Verify Tracepoint prerequisites
        working-directory: kernel-tree
        run: |
          test "$(sed -n 's/^VERSION = //p' Makefile)" -ge 5
          test "$(sed -n 's/^PATCHLEVEL = //p' Makefile)" -ge 10
          grep -q '^CONFIG_TRACEPOINTS=y' .config
          grep -q '^CONFIG_HAVE_SYSCALL_TRACEPOINTS=y' .config

      - name: Prepare LKM build
        working-directory: kernel-tree
        run: |
          make -j2 ARCH=arm64 CC=clang-14 LD=ld.lld-14 \
            CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- \
            HOSTCFLAGS=-fcommon LLVM_IAS=1 modules_prepare

      - name: Build Kernel Informater LKM
        working-directory: kernel-tree
        run: |
          make -j2 ARCH=arm64 CC=clang-14 LD=ld.lld-14 \
            CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- \
            HOSTCFLAGS=-fcommon LLVM_IAS=1 M=kernel/Kernel_Informater modules
          test -f kernel/Kernel_Informater/ki.ko
          file kernel/Kernel_Informater/ki.ko

      - name: Upload LKM
        uses: actions/upload-artifact@v4
        with:
          name: ki-tracepoint-syscall-redirect-android12-5.10
          path: kernel-tree/kernel/Kernel_Informater/ki.ko
