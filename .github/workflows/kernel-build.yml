name: Kernel integration build

on:
  push:
    branches: ["filesystem-kfunc"]
  pull_request:
    branches: ["main"]

jobs:
  build-kernel-5-10:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Informater
        uses: actions/checkout@v4

      - name: Checkout Android common 5.10
        run: |
          git clone --depth 1 --branch android12-5.10 \
            https://android.googlesource.com/kernel/common kernel-tree

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev python3 clang-14 lld-14

      - name: Integrate Kernel Informater
        run: |
          set -eux
          mkdir -p kernel-tree/kernel/Kernel_Informater
          cp -a kernel/. kernel-tree/kernel/Kernel_Informater/
          printf '\nsource "kernel/Kernel_Informater/Kconfig"\n' >> kernel-tree/kernel/Kconfig
          printf '\nobj-m += Kernel_Informater/\n' >> kernel-tree/kernel/Makefile
          sh kernel-tree/kernel/Kernel_Informater/integrate.sh kernel-tree

      - name: Configure
        working-directory: kernel-tree
        run: |
          make ARCH=arm64 defconfig
          scripts/config --enable CONFIG_KI
          scripts/config --enable CONFIG_KI_TRACEPOINT_HOOK
          scripts/config --disable CONFIG_KGDB
          make ARCH=arm64 olddefconfig

      - name: Compile Kernel Informater
        working-directory: kernel-tree
        run: |
          make -j2 ARCH=arm64 CC=clang-14 LD=ld.lld-14 HOSTCFLAGS=-fcommon LLVM_IAS=1 M=kernel/Kernel_Informater modules
